replicaCount: 1

image:
  repository: sihanudayaratna/launchpad-demo
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  port: 80

ttl: 72h

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

prNumber: ""

host: ""

# Name of the Traefik certificate resolver that obtains this preview's
# certificate. Empty serves the preview over plain http, which is what an
# install with no ACME set up gets.
tlsResolver: ""
