apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: launchpad-controller
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /webhook
            pathType: Exact
            backend:
              service:
                name: launchpad-controller
                port:
                  number: 8090
