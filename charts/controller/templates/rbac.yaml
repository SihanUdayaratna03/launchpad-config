apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-controller
{{- if eq (.Values.backend | default "argocd") "argocd" }}
# Editing the ApplicationSet is how the controller works in the Argo CD mode. In
# the OpenChoreo mode it creates Projects instead and never touches Argo CD, so
# it is not given this; see rbac-openchoreo.yaml.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-controller
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-controller
subjects:
  - kind: ServiceAccount
    name: launchpad-controller
roleRef:
  kind: Role
  name: launchpad-controller
  apiGroup: rbac.authorization.k8s.io
{{- end }}
