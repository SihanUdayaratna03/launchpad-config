apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchpad-controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: launchpad-controller
  template:
    metadata:
      labels:
        app: launchpad-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: launchpad-controller
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: launchpad-webhook
                  key: secret
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: launchpad-github
                  key: token
                  optional: true
            - name: BASE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: launchpad-env
                  key: base-domain
                  optional: true
            - name: TLS_RESOLVER
              valueFrom:
                configMapKeyRef:
                  name: launchpad-env
                  key: tls-resolver
                  optional: true
            - name: BACKEND
              value: {{ .Values.backend | default "argocd" | quote }}
            {{- if eq (.Values.backend | default "argocd") "openchoreo" }}
            - name: OC_NAMESPACE
              value: {{ .Values.openchoreo.namespace | quote }}
            - name: OC_ENVIRONMENT
              value: {{ .Values.openchoreo.environment | quote }}
            - name: OC_IMAGE
              value: {{ .Values.openchoreo.image | quote }}
            - name: OC_HOST
              value: {{ .Values.openchoreo.host | quote }}
            {{- end }}
          ports:
            - containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: launchpad-controller
spec:
  selector:
    app: launchpad-controller
  ports:
    - port: 8090
      targetPort: 8090
