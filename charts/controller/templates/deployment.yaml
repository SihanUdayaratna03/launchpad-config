apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchpad-controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: launchpad-controller
  template:
    metadata:
      labels:
        app: launchpad-controller
    spec:
      serviceAccountName: launchpad-controller
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: launchpad-controller
spec:
  selector:
    app: launchpad-controller
  ports:
    - port: 8090
      targetPort: 8090
