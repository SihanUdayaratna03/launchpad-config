image:
  repository: sihanudayaratna/launchpad-controller
  tag: 4bbe7a0a78a6aba528ea7ca01e6bd762a691466f
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Which deployment engine the controller and the reaper talk to:
# argocd (the default, and what the AWS install uses) or openchoreo.
backend: argocd

# Only read when backend is openchoreo.
openchoreo:
  namespace: default
  environment: development
  image: sihanudayaratna/launchpad-demo
  host: development-default.openchoreoapis.localhost:19080

reaper:
  schedule: "*/10 * * * *"
  ttl: 72h
  dryRun: false
  githubRepo: "SihanUdayaratna03/launchpad"
