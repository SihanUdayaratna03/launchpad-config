apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: preview-disallow-latest-tag
  annotations:
    description: "Images in preview namespaces must be pinned."
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        launchpad.io/preview: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - message: "Images must have an explicit tag (not :latest) or a digest."
      expression: >-
        object.spec.containers.all(c,
          c.image.contains('@') ||
          (c.image.contains(':') && !c.image.endsWith(':latest')))
